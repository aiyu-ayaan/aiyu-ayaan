<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-label="Hi, I'm Ayaan. Writes code on Linux, plays on Windows.">
  <title>Hi, I'm Ayaan. Writes code on Linux, plays on Windows.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .muted { fill: #86868b; }
    .text { fill: #f5f5f7; }
    .small { font-size: 11px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1d1d20"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="38%" r="55%">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="840" height="280" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="840" height="280" fill="#050506"/>
    <rect y="35" width="840" height="245" fill="url(#dots)"/>
    <rect y="35" width="840" height="245" fill="url(#glow)"/>
    <rect width="840" height="34" fill="#111114"/>
    <rect y="34" width="840" height="1" fill="#2b2b30"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="279" rx="12" fill="none" stroke="#2b2b30"/>

  <circle cx="20" cy="17" r="5" fill="#ff375f"/>
  <circle cx="38" cy="17" r="5" fill="#ff9f0a"/>
  <circle cx="56" cy="17" r="5" fill="#30d158"/>
  <text x="420" y="21.5" class="muted small" text-anchor="middle">aiyu — portfolio</text>
  <circle class="pulse" cx="760" cy="17" r="3.5" fill="#30d158"/>
  <text x="820" y="21.5" class="small" text-anchor="end" fill="#30d158" letter-spacing="1">ONLINE</text>

  <text x="40" y="84" font-size="14"><tspan fill="#2997ff">$</tspan><tspan class="muted" dx="9">whoami</tspan></text>

  <text x="38" y="146" font-size="46" font-weight="700" class="text">Hi, I'm Ayaan<tspan fill="#2997ff">.</tspan></text>

  <text x="40" y="188" font-size="16"><tspan fill="#2997ff">&gt;</tspan><tspan class="muted" dx="10">Writes code on Linux, plays on Windows.</tspan><tspan class="cursor" fill="#2997ff" dx="6" font-weight="700">_</tspan></text>

  <rect x="40" y="226" width="760" height="1" fill="#1d1d20"/>
  <text x="40" y="252" class="small" letter-spacing="0.5">
    <tspan class="muted">[ </tspan><tspan class="text">software engineer</tspan><tspan class="muted"> ]</tspan>
    <tspan class="muted" dx="10">[ </tspan><tspan class="text">agentic, spec-first development</tspan><tspan class="muted"> ]</tspan>
    <tspan class="muted" dx="10">[ </tspan><tspan class="text">mumbai</tspan><tspan class="muted"> ]</tspan>
  </text>
  <text x="800" y="252" class="small" text-anchor="end" fill="#2997ff">me.aiyu.co.in</text>
</svg>
