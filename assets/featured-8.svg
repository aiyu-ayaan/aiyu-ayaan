<svg xmlns="http://www.w3.org/2000/svg" width="410" height="282" viewBox="0 0 410 282" role="img" aria-label="Rewire: Android app that reduces unwanted habits by adding intentional friction before distracting apps open. It creates a pause, lets you choose, and shows your own patterns. No punishment, no surveillance. Runs on android. Stack: Kotlin, Android.">
  <title>Rewire</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .muted { fill: #86868b; }
    .text { fill: #f5f5f7; }
    .small { font-size: 11px; }
    .tiny { font-size: 9px; }
    .slab { animation: float 6s ease-in-out infinite; animation-delay: -10.5s; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 6s ease-in-out infinite; animation-delay: -10.5s; }
    .cube { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite; animation-delay: -4.9s; }
    .dev { animation: lift 4s ease-in-out infinite; }
    .scr { animation: lit 3s ease-in-out infinite; }
    .led { animation: blink 1.6s steps(1) infinite; }
    .sheen { animation: sheen 6s ease-in-out infinite; animation-delay: 6.3s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-2px, -4px); } }
    @keyframes shadow { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: .45; transform: scale(.97); } }
    @keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2.5px) scale(1.06); } }
    @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes lit { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
    @keyframes blink { 50% { opacity: .15; } }
    @keyframes sheen { 0%, 55% { transform: translateX(-140px); } 100% { transform: translateX(550px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171b"/><stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97BFF"/><stop offset="1" stop-color="#A97BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="6" y="8" width="388" height="254" rx="12"/></clipPath>
  </defs>
  <rect class="shadow" x="18" y="22" width="388" height="254" rx="12" fill="#000"/>
  <g class="slab">
    <rect x="15" y="19" width="388" height="254" rx="12" fill="#33254d"/>
    <path d="M18 262L27 273H391L403 261V31L394 20V262Z" fill="#47346b"/>
    <rect x="6" y="8" width="388" height="254" rx="12" fill="url(#face)"/>
    <g clip-path="url(#clip)">
      <rect x="6" y="8" width="388" height="3" fill="url(#glow)"/>
      <rect class="sheen" x="0" y="8" width="120" height="254" fill="url(#shine)" transform="skewX(-18)"/>
    </g>
    <rect x="6.5" y="8.5" width="387" height="253" rx="12" fill="none" stroke="#2b2b30"/>
    <g transform="translate(6, 8)">
      <g class="cube"><path d="M34 25L45 30.5L34 36L23 30.5Z" fill="#bf9cff"/><path d="M23 30.5L34 36L34 47L23 41.5Z" fill="#8460c7"/><path d="M45 30.5L34 36L34 47L45 41.5Z" fill="#513b7a"/></g>
      <text x="56" y="34" class="text" style="font-size:16px;font-weight:700">Rewire</text>
      <path d="M6 .6l1.7 3.4 3.7.5-2.7 2.6.6 3.7L6 9.1 2.7 10.8l.6-3.7L.6 4.5l3.7-.5z" transform="translate(56, 40) scale(.85)" fill="#ff9f0a"/>
      <text x="70" y="50" class="small text">5</text>
      <text x="84.7" y="50" class="small" fill="#30d158">v1.1.4</text>
      <g class="dev" style="animation-delay:0.0s"><path d="M347.6 49.7L358 55.7L358 31.7L347.6 25.7Z" fill="#3b3b44"/><path d="M360.4 54.3L358 55.7L358 31.7L360.4 30.3Z" fill="#232329"/><path d="M350 24.3L360.4 30.3L358 31.7L347.6 25.7Z" fill="#808085"/><path d="M348.6 48.5L356.9 53.3L356.9 32.9L348.6 28.1Z" fill="#A97BFF" class="scr"/></g>
      <text x="354" y="76" text-anchor="middle" class="muted tiny">android</text>
      <text x="20" y="106" class="muted">Android app that reduces unwanted habits by</text>
      <text x="20" y="123" class="muted">adding intentional friction before distracting</text>
      <text x="20" y="140" class="muted">apps open. It creates a pause, lets you choose,</text>
      <text x="20" y="157" class="muted">and shows your own patterns. No punishment, no</text>
      <text x="20" y="174" class="muted">surveillance.</text>
      <rect x="20" y="202" width="348" height="1" fill="#2b2b30"/>
      <text x="20" y="222" class="small" fill="#c7a9ff">Kotlin, Android</text>
    </g>
  </g>
</svg>
