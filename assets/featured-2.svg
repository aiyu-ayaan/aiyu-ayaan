<svg xmlns="http://www.w3.org/2000/svg" width="410" height="282" viewBox="0 0 410 282" role="img" aria-label="Aiyu: The portfolio and CMS behind me.aiyu.co.in. 52 themes, a Markdown blog with Notion sync, a LaTeX resume editor, a visual cron scheduler with encrypted secrets, and an MCP server. Runs on web, server. Stack: Next.js 16, React 19, PostgreSQL, Prisma, Gemini, Docker.">
  <title>Aiyu</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .muted { fill: #86868b; }
    .text { fill: #f5f5f7; }
    .small { font-size: 11px; }
    .tiny { font-size: 9px; }
    .slab { animation: float 6s ease-in-out infinite; animation-delay: -1.5s; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 6s ease-in-out infinite; animation-delay: -1.5s; }
    .cube { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite; animation-delay: -0.7s; }
    .dev { animation: lift 4s ease-in-out infinite; }
    .scr { animation: lit 3s ease-in-out infinite; }
    .led { animation: blink 1.6s steps(1) infinite; }
    .sheen { animation: sheen 6s ease-in-out infinite; animation-delay: 0.9s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-2px, -4px); } }
    @keyframes shadow { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: .45; transform: scale(.97); } }
    @keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2.5px) scale(1.06); } }
    @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes lit { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
    @keyframes blink { 50% { opacity: .15; } }
    @keyframes sheen { 0%, 55% { transform: translateX(-140px); } 100% { transform: translateX(550px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
