    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1e05a"/><stop offset="1" stop-color="#f1e05a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="6" y="8" width="388" height="254" rx="12"/></clipPath>
  </defs>
  <rect class="shadow" x="18" y="22" width="388" height="254" rx="12" fill="#000"/>
