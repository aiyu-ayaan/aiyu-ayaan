<svg xmlns="http://www.w3.org/2000/svg" width="410" height="282" viewBox="0 0 410 282" role="img" aria-label="BetweenUs: End-to-end encrypted, Discord-style messaging and calls for desktop, web and Android. Eight NestJS services behind Nginx. Messages are encrypted on the client with AES-256-GCM, so the server stores only ciphertext. Calls use a peer-to-peer WebRTC mesh with no media server. Runs on android, web, desktop, server. Stack: NestJS, TypeScript, Electron, React, Jetpack Compose, WebRTC, PostgreSQL, Redis.">
