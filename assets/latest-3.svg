      <text x="101.2" y="152" class="muted small">2</text>
      <rect x="260.2" y="139" width="107.8" height="18" rx="9" fill="#ff9f0a" fill-opacity=".12" stroke="#ff9f0a" stroke-opacity=".45"/>
      <text x="361" y="152" text-anchor="end" class="small" fill="#ff9f0a">v0.0.1-alpha.6</text>
    </g>
  </g>
</svg>
