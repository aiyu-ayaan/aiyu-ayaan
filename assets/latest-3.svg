      </g>
      <text x="20" y="78" class="muted">Beautiful open-source Android file manager</text>
      <text x="20" y="96" class="muted">built with Jetpack Compose and Material 3</text>
      <text x="20" y="114" class="muted">Expressive. Multi-tab and dual-pane…</text>
      <circle cx="25" cy="148" r="5" fill="#A97BFF"/>
      <text x="37" y="152" class="text small">Kotlin</text>
