<svg xmlns="http://www.w3.org/2000/svg" width="840" height="448" viewBox="0 0 840 448" role="img" aria-label="BetweenUs architecture. Clients: Desktop, Web, Android. Edge: Cloudflare Tunnel, Nginx gateway. Services: auth, server, chat, presence, notification, call, remote-gateway. Stores: PostgreSQL, Redis. Calls: WebRTC mesh, client to client. No media server.">
  <title>BetweenUs architecture. Clients: Desktop, Web, Android. Edge: Cloudflare Tunnel, Nginx gateway. Services: auth, server, chat, presence, notification, call, remote-gateway. Stores: PostgreSQL, Redis. Calls: WebRTC mesh, client to client. No media server.</title>
