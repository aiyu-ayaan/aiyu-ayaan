  <style>
    .tiny { font-size: 10px; }
    path.flow, path.p2p, path.bus { fill: none; stroke-linecap: round; }
    .flow { stroke: #2997ff; stroke-opacity: .55; stroke-width: 1.2; stroke-dasharray: 2 7; animation: march 1.1s linear infinite; }
    .data { stroke: #ff375f; }
    .bus { stroke: #ff375f; stroke-opacity: .5; stroke-width: 1.5; }
    .p2p { stroke: #30d158; stroke-width: 1.4; stroke-dasharray: 5 5; animation: swing 1.4s linear infinite alternate; }
    .node { animation: in .55s ease-out both; animation-delay: calc(var(--i) * 70ms); }
    @keyframes march { from { stroke-dashoffset: 9; } to { stroke-dashoffset: 0; } }
    @keyframes swing { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text x="24" y="62" class="muted small">Messages are encrypted on</text>
  <text x="24" y="77" class="muted small">the client with</text>
  <text x="24" y="92" class="muted small">AES-256-GCM. The server</text>
  <text x="24" y="107" class="muted small">stores only ciphertext.</text>
