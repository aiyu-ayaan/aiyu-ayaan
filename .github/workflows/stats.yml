name: Update profile stats

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-stats.mjs'
      - '.github/workflows/stats.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # STATS_TOKEN is optional: a personal access token (read:user, repo) makes
      # private contributions count. Without it only public activity is shown.
      - name: Generate cards
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Open PR with refreshed stats
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: assets
          commit-message: "chore: refresh profile stats"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: chore/refresh-profile-stats
          delete-branch: true
          title: "chore: refresh profile stats"
          body: |
            Automated profile stats refresh generated by GitHub Actions.

      # master requires a review the bot can't give itself. STATS_TOKEN belongs to
      # a repo admin (admins aren't enforced), so --admin merges past that rule.
      - name: Merge PR
        if: steps.cpr.outputs.pull-request-number != '' && env.GH_TOKEN != ''
        run: gh pr merge "$PR" --squash --admin --delete-branch
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
