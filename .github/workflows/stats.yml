name: Update profile stats

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-stats.mjs'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # STATS_TOKEN is optional: a personal access token (read:user, repo) makes
      # private contributions count. Without it only public activity is shown.
      - name: Generate cards
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Stats unchanged"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
